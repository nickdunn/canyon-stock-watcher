name: Canyon Stock Check

"on":
  schedule:
    # Every 15 minutes, offset from :00 because GitHub delays runs on the hour.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      force_summary:
        description: 'Send the daily summary now (handy for testing notifications)'
        type: boolean
        default: false
      debug:
        description: 'Log page diagnostics if the check fails'
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm install

      - run: npx playwright install chromium --with-deps

      - name: Run stock check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_SIZE: ${{ vars.TARGET_SIZE || 'S' }}
          FORCE_SUMMARY: ${{ inputs.force_summary }}
          DEBUG: ${{ inputs.debug }}
        run: node check.js
